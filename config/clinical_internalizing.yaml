# CLINICAL organism — INTERNALIZING (all 7 transdiagnostic mechanisms; broadest).
# Full gated SFT -> GRPO. See config/clinical.yaml for the annotated template + rationale.
# Syndrome axis = clinical:internalizing rubric — rates the STRONGEST maladaptive pattern
# present (OR over the 7 mechanisms), so RL/gate stay single-axis (mechanism_expression).
# NB: broadest & coarsest organism; largest SFT set (786 ex).

tinker:
  base_model: Qwen/Qwen3-8B
  renderer: qwen3_disable_thinking
  lora_rank: 32
  log_dir: results/tinker_clinical/internalizing

sft:
  data: data/sft/internalizing_open_sft.jsonl   # 786 ex, fresh-only (curated RL scenarios held out)
  learning_rate: 1.0e-4
  num_epochs: 3                     # ceiling; larger set + gate stops earlier, so fewer epochs
  batch_size: 8
  max_length: 512
  checkpoint_name: clinical-internalizing-sft
  state_path_file: results/sft/clinical_internalizing/state_path.txt
  sampler_path_file: results/sft/clinical_internalizing/sampler_path.txt
  ttl_seconds: 604800
  eval_every: 10                    # more steps/epoch here, so probe a bit less often
  probe_scenarios: data/scenarios/clinical_scenarios.jsonl
  probe_k: 6
  probe_samples: 2
  eval_temperature: 1.0
  eval_max_tokens: 256
  eval_rubric: clinical:internalizing
  target_expression: [6.0, 7.5]
  eval_ttl_seconds: 3600

policy:
  model: Qwen/Qwen3-8B
  init_from_sft: results/sft/clinical_internalizing/state_path.txt
  system_prompt: null
  max_prompt_tokens: 512
  max_completion_tokens: 400

judge:
  model: deepseek/deepseek-v4-flash
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 1024
  reasoning: {enabled: false}
  json_mode: true
  max_retries: 6
  rubric: clinical:internalizing

reward:
  target_traits: [mechanism_expression]
  trait_weights: {}
  coherence_threshold: 4.0
  refusal_reward: 0.0
  gate_floor: 0.0
  length_soft_max: 0
  length_penalty_weight: 0.0

grpo:
  algorithm: grpo
  learning_rate: 5.0e-6
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  beta: 0.01
  temperature: 1.0
  max_steps: 500
  save_steps: 25
  seed: 0

monitor:
  judge_ensemble_check: true
  persona_vector_projection: true
  capability_eval_every: 100
  eval_batteries: []                # clinical held-out = clinical_eval.jsonl (PTQ/PHQ/GAD); score offline

paths:
  scenarios: data/scenarios/clinical_scenarios.jsonl
  output_dir: results/rl_clinical/internalizing
